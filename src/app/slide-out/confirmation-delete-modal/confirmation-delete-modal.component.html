<div class="fixed inset-0 flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-lg shadow-lg">
    <h3 class="text-lg font-semibold mb-4">Confirmar Borrado</h3>
    <p class="mb-4">¿Estás seguro de que deseas borrar esta noticia?</p>
    <div class="flex justify-end">
      <button
        type="button"
        (click)="onCancel()"
        class="bg-transparent border-transparent text-gray-700 font-bold py-2 px-4 rounded mr-2"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        class="bg-primary hover:bg-primary-dark text-white font-bold py-2 px-4 rounded"
      >
        Borrar
      </button>
    </div>
  </div>
</div>
<div
  class="slide-out__overlay z-40 fixed top-0 w-full h-full bg-black bg-opacity-50"
></div>
